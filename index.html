<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Noma Music</title>
  <link rel="stylesheet" href="css/app.css">
  <link rel="icon" href="/Assets/Logo/Favicon/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="96x96" href="/Assets/Logo/Favicon/favicon-96x96.png">
  <link rel="icon" type="image/svg+xml" href="/Assets/Logo/Favicon/favicon.svg">
  <link rel="apple-touch-icon" href="/Assets/Logo/Favicon/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Noma Music">
  <meta name="theme-color" content="#0a0a0a">
  <link rel="manifest" href="/Assets/Logo/Favicon/site.webmanifest">
</head>
<body>
  <div id="bg-layer" class="bg-layer" aria-hidden="true"></div>
  <div class="bg-overlay" aria-hidden="true"></div>

  <div class="app">
    <header class="topbar">
      <div class="logo">
        <img src="Assets/Logo/NomaMusicLogoText.png" alt="Noma Music" class="logo-img">
      </div>
      <nav class="tabs">
       <button class="tab active" data-tab="games">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M21 6H3c-1.1 0-2 .9-2 2v8c0 1.1.9 2 2 2h18c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm-10 7H8v3H6v-3H3v-2h3V8h2v3h3v2zm4.5 2c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zm4-3c-.83 0-1.5-.67-1.5-1.5S18.67 9 19.5 9s1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"/></svg>
             Spiele
        </button>
        <button class="tab" data-tab="playlists">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M15 6H3v2h12V6zm0 4H3v2h12v-2zM3 16h8v-2H3v2zM17 6v8.18c-.31-.11-.65-.18-1-.18-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3V8h3V6h-5z"/></svg>
                Playlists
            </button>
      </nav>
    </header>

    <main class="content">
      <section id="tab-games" class="tab-panel active">
        <h1 class="page-title">Deine Spiele</h1>
        <div id="games-grid" class="games-grid"></div>
      </section>

      <section id="tab-playlists" class="tab-panel">
        <h1 class="page-title">Playlists</h1>
        <p class="muted">Eigene Playlists kommen als Nächstes.</p>
        <div id="playlists-list" class="playlists-list"></div>
      </section>

<section id="game-detail" class="tab-panel hidden">
  <button id="back-to-games" class="back-btn">
    <img src="Assets/Common/Back1.png" alt="" class="back-icon">
    Zurück
  </button>

  <div class="game-header">
    <img id="game-cover" class="game-cover-lg" src="" alt="">

    <div class="game-meta">
      <p class="label">Spiel</p>
      <h1 id="game-title"></h1>

      <div class="game-info-row">
        <p id="game-track-count" class="muted"></p>
        <p id="game-composer" class="composer">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
            <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
          </svg>
          <span id="game-composer-name"></span>
        </p>
      </div>

      <div class="game-play-actions">
        <button id="play-all-btn" class="primary-btn">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
          Alles abspielen
        </button>
        <button id="shuffle-all-btn" class="circle-btn" title="Shuffle album" aria-label="Shuffle album">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
            <path d="M10.59 9.17L5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm.33 9.41l-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/>
          </svg>
        </button>
      </div>
    </div>
  </div>

  <div id="track-list" class="track-list"></div>
</section>
    </main>

    <!-- Always-visible bottom player -->
    <footer id="player-bar" class="player-bar">
      <div class="player-left" id="player-left">
        <img id="now-cover" class="now-cover" src="" alt="">
        <div class="now-text">
          <div id="now-title" class="now-title">Nichts läuft</div>
          <div id="now-game" class="now-game">—</div>
        </div>
      </div>

      <div class="player-center">
        <div class="controls">
    <button id="btn-shuffle" class="ctrl-btn" title="Shuffle" aria-label="Shuffle">
         <svg class="icon" viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M10.59 9.17L5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm.33 9.41l-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/></svg>
    </button>
    <button id="btn-prev" class="ctrl-btn" title="Vorheriger" aria-label="Previous">
        <svg class="icon" viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
    </button>
    <button id="btn-play" class="ctrl-btn play-btn" title="Play/Pause" aria-label="Play">
        <svg id="icon-play" class="icon" viewBox="0 0 24 24" width="28" height="28" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
        <svg id="icon-pause" class="icon hidden" viewBox="0 0 24 24" width="28" height="28" fill="currentColor"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
    </button>
    <button id="btn-next" class="ctrl-btn" title="Nächster" aria-label="Next">
        <svg class="icon" viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
    </button>
    <button id="btn-loop" class="ctrl-btn" title="Loop" aria-label="Loop">
     <svg class="icon" viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg>
    </button>
        </div>
        <div class="progress-row">
          <span id="time-current" class="time">0:00</span>
          <div id="progress-bar" class="progress-bar">
            <div id="progress-fill" class="progress-fill"></div>
          </div>
          <span id="time-total" class="time">0:00</span>
        </div>
      </div>

      <div class="player-right">
        <div class="volume-wrap" id="volume-wrap" title="Lautstärke">
          <svg class="volume-icon" viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
            <path d="M3 10v4h4l5 5V5L7 10H3zm13.5 2c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
        </svg>
          <input id="volume-slider" class="volume-slider" type="range" min="0" max="1" step="0.01" value="1">
      </div>
        <button id="btn-queue" class="ctrl-btn" title="Warteschlange">☰</button>
        <button id="btn-fullscreen" class="ctrl-btn" title="Vollbild">⛶</button>
        <button id="btn-minimize" class="ctrl-btn hidden" title="Verkleinern">
          <img src="Assets/MusicPlayer/Minimize.png" alt="" class="ctrl-img">
        </button>
      </div>
    </footer>
  </div>

  <!-- Queue panel -->
  <aside id="queue-panel" class="queue-panel hidden">
    <div class="queue-header">
      <h2>Warteschlange</h2>
      <button id="queue-close" class="ctrl-btn">✕</button>
    </div>
    <ul id="queue-list" class="queue-list"></ul>
  </aside>

  <!-- Context menu -->
<div id="context-menu" class="context-menu hidden">
  <button data-action="play-next">
    <svg class="menu-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M7.58 4.08L6.15 5.5 10.65 10H3v2h7.65l-4.5 4.5 1.43 1.42L14.5 11 7.58 4.08zM19 6v6.18c-.31-.11-.65-.18-1-.18-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3V8h3V6h-5z"/></svg>
    Als Nächstes spielen
  </button>
  <button data-action="add-end">
    <svg class="menu-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M14 10H2v2h12v-2zm0-4H2v2h12V6zM2 16h8v-2H2v2zm19.5-4.5L23 13l-6.99 7-4.51-4.5L13 14l3.01 3 5.49-5.5z"/></svg>
    Ans Ende der Queue
  </button>
</div>
  </div>

  <!-- Fullscreen stage (cover only – controls stay in bottom bar) -->
  <div id="fullscreen-player" class="fullscreen-player hidden">
    <img id="fs-cover" class="fs-cover" src="" alt="">
    <h2 id="fs-title" class="fs-title"></h2>
    <p id="fs-game" class="fs-game muted"></p>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
